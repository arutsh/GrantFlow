schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Repo: GrantFlow (nonprofit grant budgeting/reporting platform).
  Services: services/budget, services/users, services/ai, services/chat (FastAPI); frontend-typescript (React + TypeScript, React Query); nginx gateway proxying /api/v1/<prefix>/ to each service.
  OpenSpec change dir naming (see docs/development/WORKFLOW.md for the full convention): <service>-<type>-<issue>-<description>, flat kebab-case, e.g. shared-feat-292-audit-mixin-auto-population. service in ai, backend, budget, chat, feature, frontend, platform, shared, users; type in feat, fix, chore, refactor. Propose under a temp kebab-case name if the parent GitHub issue doesn't exist yet, then rename the dir once scripts/new-issue.sh creates it. Do NOT prefix the dir with a priority label (HIGH/MED/LOW) — priority lives only in .openspec.yaml's `priority` field.
  Each tasks.md task group becomes its own GitHub sub-issue of that parent, created and linked via scripts/start-group.sh (not by hand) when the group's implementation starts.
  Branch naming: <Service>/<type>/Issue-<sub-issue>/<description>[-group<N>] (Service title-cased: Platform, Frontend, Shared, Budget, Users, AI, Chat, Backend, Feature; type lowercase, same as the change's type; sub-issue is that group's own sub-issue number, not the parent's) — created by scripts/start-group.sh, not by hand.
  Code comments: keep to short one- or two-liners explaining WHY, not WHAT; no multi-line rationale blocks in source files.
  Never `git commit`, `git push`, or open a PR without the user's explicit go-ahead for that specific action — a prior approval (e.g. "commit and push this one") authorizes only that instance, not standing permission for later commits/pushes in the same session or change.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Keep proposals under 500 words
  tasks:
    - "Workflow rule: one task group = one GitHub sub-issue (of this change's parent issue) = one PR, merged before the next group starts. State this rule verbatim as the first line of tasks.md, above the first '## 1.' heading."
    - "Every group's FIRST task (e.g. '1.0', '2.0') must be: 'Run `scripts/start-group.sh <change-name> <N>` to create/link this group's sub-issue and branch before starting any other work in this group.' Do not start on the rest of a group's tasks until this one is checked off."
    - Structure task groups as independently mergeable vertical slices (not horizontal implementation layers), ordered by dependency, so each group's PR is real, reviewable, shippable work on its own.
    - Every group's final task must be "Run <the project's tests/lint for the affected area> clean; PR merged" — do not bundle a separate cross-cutting "wrap-up" group at the end; fold final integration/manual-verification tasks into the last functional group instead.
    - Note in each group's heading which earlier group(s) it depends on (e.g. "## 3. <name> — ticket depends on 1, 2"), so the merge order is unambiguous.
