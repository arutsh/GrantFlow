server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — react-router owns everything under "/", so any path
    # nginx doesn't have a static file for (a deep link, a browser refresh
    # on a nested route) must still resolve to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
